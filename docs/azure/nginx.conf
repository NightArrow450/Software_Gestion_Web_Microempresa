# Se incluye dentro del bloque http de Nginx en App Service Linux PHP.
# Solo para el ingreso administrado de Azure con HTTPS Only activado.
map $http_x_forwarded_proto $azure_https {
    default off;
    https on;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /home/site/wwwroot/public;
    index index.php;
    port_in_redirect off;
    server_tokens off;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Evita ejecutar PHP subido como archivo o cualquier entrada distinta al front controller.
    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $azure_https;
        fastcgi_read_timeout 120;
        fastcgi_intercept_errors off;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }
}
