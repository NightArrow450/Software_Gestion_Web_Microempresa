name: Preparar recursos Vite
description: Instala desde el lockfile sin scripts y compila los recursos reales, sin cachés persistentes.
runs:
  using: composite
  steps:
    - name: Preparar Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verificado el 24-10-2026
      with:
        node-version: '22'
    - name: Instalar dependencias JavaScript
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Compilar Vite
      shell: bash
      run: npm run build
