name: Evidencias visuales PR 49

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/visual-pr49.yml'
      - 'tests/Visual/**'
      - 'public/css/**'
      - 'public/js/**'
      - 'resources/views/**'

permissions:
  contents: read

concurrency:
  group: visual-pr49-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual:
    if: github.event.pull_request.number == 49
    name: Chromium — capturas, interacción y PDF ficticio
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      MYSQL_TEST_ENABLE: '0'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-php
      - uses: ./.github/actions/preparar-vite
      - name: Preparar herramientas solo en el runner
        run: |
          npm install --prefix "$RUNNER_TEMP/navegador" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/navegador/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Preparar identidad aislada y datos ficticios
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e .env
          test ! -e "$RUNNER_TEMP/pr49-visual.sqlite"
          touch "$RUNNER_TEMP/pr49-visual.sqlite"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf 'VISUAL_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          printf 'APP_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          printf 'VISUAL_DATABASE=%s/pr49-visual.sqlite\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Crear escenario y servir exclusivamente en loopback del runner
        run: |
          php tests/Visual/preparar.php
          test -s "$RUNNER_TEMP/visual-fixture.json"
          php -S 127.0.0.1:8099 -t public tests/Visual/servidor.php > "$RUNNER_TEMP/visual-servidor.log" 2>&1 &
          echo "VISUAL_PID=$!" >> "$GITHUB_ENV"
          for intento in $(seq 1 30); do
            if curl --noproxy '*' --fail --silent http://127.0.0.1:8099/login > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Recorrer pantallas e interacciones reales
        run: node tests/Visual/navegador.cjs
      - name: Comprobar PDF y generar vista previa
        if: ${{ !cancelled() }}
        run: |
          pdfinfo "$RUNNER_TEMP/evidencias-pr49/notas.pdf" > "$RUNNER_TEMP/evidencias-pr49/pdf-info.txt"
          pdftotext -layout "$RUNNER_TEMP/evidencias-pr49/notas.pdf" "$RUNNER_TEMP/evidencias-pr49/notas.txt"
          python3 - <<'PY'
          import json, os, re, sqlite3
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          info = (root/'evidencias-pr49/pdf-info.txt').read_text()
          texto = (root/'evidencias-pr49/notas.txt').read_text()
          datos = json.loads((root/'visual-fixture.json').read_text())
          assert re.search(r'Pages:\s+1\b', info), 'Se esperaba una sola hoja con dos notas'
          tamano = re.search(r'Page size:\s+([\d.]+) x ([\d.]+) pts', info)
          assert tamano and abs(float(tamano[1])-841.89) < 2 and abs(float(tamano[2])-595.28) < 2, 'No es A4 horizontal'
          assert datos['nota1'] != datos['nota2']
          assert datos['nota1'] in texto and datos['nota2'] in texto, 'Falta una numeración independiente'
          db = sqlite3.connect('file:' + os.environ['VISUAL_DATABASE'] + '?mode=ro', uri=True)
          actual = db.execute('SELECT cantidad FROM pedido_detalles WHERE pedido_id=? AND retirado_en IS NULL', (datos['parcial'],)).fetchone()[0]
          original = json.loads(db.execute('SELECT datos FROM pedido_versiones WHERE pedido_id=? ORDER BY numero LIMIT 1', (datos['parcial'],)).fetchone()[0])['lineas'][0]['cantidad']
          assert actual == 32 and original == 54, 'Retiro comercial o conservación del original incorrectos'
          (root/'evidencias-pr49/retiro-verificado.json').write_text(json.dumps({'original': original, 'vigente': actual, 'retiradas': original-actual}, indent=2))
          db.close()
          print('PDF: una hoja A4 horizontal, dos notas distintas y numeración independiente comprobada.')
          PY
          pdftoppm -png -singlefile -scale-to 1600 "$RUNNER_TEMP/evidencias-pr49/notas.pdf" "$RUNNER_TEMP/evidencias-pr49/notas-a4-horizontal"
      - name: Conservar únicamente evidencias ficticias
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, SHA verificado
        with:
          name: evidencias-pr49-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidencias-pr49/
          if-no-files-found: error
          retention-days: 5
      - name: Detener únicamente el servidor temporal del runner
        if: always()
        run: |
          if [ -n "${VISUAL_PID:-}" ]; then kill "$VISUAL_PID" 2>/dev/null || true; fi
